<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BACKGROUND</title>
    <style>
        .container{
            width:200px;
            height:200px;
            border: 1px solid gray;
            background-color:blanchedalmond;
            background-image:url("images/ytcover.png");
            background-size:contain; /*values: cover, contain*/
            background-repeat:no-repeat; 
            background-position: bottom;
            background-position:center;
            background-position:top right;     
        }

        .container1{
            width:200px;
            height:200px;
            background-image:linear-gradient(45deg, blue 0% 80%, green 80% 90%, red, purple)
        }

        .container2{
            width:200px;
            height:200px;
            background-image:radial-gradient(red 0% 50%, yellow 20% 100%);
            background-filter:blur(20px);
        }
    </style>
</head>
<body>

    <div class="container">

    </div>

    <div class="container1">

    </div>

    <div class="container2">

    </div>


    

</body>
</html>

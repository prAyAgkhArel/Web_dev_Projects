<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transforms</title>
    <style>
        h1{
            
            text-transform:uppercase;
            text-align:center;
            text-decoration-line:underline;
            text-decoration-style:solid;
            text-decoration-color:black;
            text-underline-offset:5px;
            margin-bottom:20px;
        }

        .transform-functions-translate{

            height: 300px;
            background-color:bisque;
            margin-bottom:25px;
        }

        .circle{
            width:100px;
            height:100px;
            border-radius:50%;
            
            position:relative;
            top:36%;
            left:37%;
           /*to use top, left position must be set*/

            
            background-color:red;
            color:white;
            

            /*This is for centering the text inside div not the div itself
            because it centers the child if display:flex or grid is set for parent*/
            display:flex;
            justify-content:center;
            align-items:center;
            
           transform: translateX(20px);
           transform: translateY(-50%); /*-50% of element's own height*/
           transform: translate(20px, -50%);
           transform: translate(20px, 0, 0); /*GPU accelerated*/
           

            
        }

        .transform-functions-rotate{
            background-color:bisque;
            height:300px;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .square{

            width:100px;
            height:100px;
            
            
           
           /*to use top, left position must be set*/

            
            background-color:red;
            color:white;
            

            /*This is for centering the text inside div not the div itself
            because it centers the child if display:flex or grid is set for parent*/
            display:flex;
            justify-content:center;
            align-items:center;

            transform: rotate(45deg);
            transform: rotateX(45deg);
            transform: rotateY(45deg);
            transform: rotateZ(45deg);


            transform:scale(1.5);
            transform:scaleX(2);
            transform:scaleY(0.5);
            transform:scale(1.2,0.8);

            transform:skewX(20deg);
            transform:skewY(10deg);
            transform:skew(20deg, 10deg);

            /*transform: matrix(a, b, c, d, e, f);
            transform: rotate(45deg) scale(1.5) translateX(20px);
            This is how you apply multiple transformations at once*/
       

           


        }

        .transform-functions{
            height:300px;
            background-color:bisque;
            margin-top:50px;

            display:flex;
            align-items:center;
            justify-content:center;
        }

        .Triangle{
             
            height:100px;
            width:100px;
            color:white;
            background-color:red;

            display:grid;
            place-items:center;

            

        }

        .sq1{
            position:relative;
            background-color:rgb(0, 255, 26);
            height:100px;
            width:200px;
            margin:10px;

            transform:rotate(45deg);
            z-index: 100;

            left:-118px;
            bottom:30px;
            top:-10;
            background-color:bisque;
        }



        .circle1{

            width:100px;
            height:100px;
            border-radius:50%;
            background-color:red;

            transform-origin: center; /*default*/
            transform-origin: 5px 5px;/* transform from fixed point*/
            transform-origin:0% 0%;   /*tranform around top left*/
            transform-origin: 100% 0%;  /*transform from topright*/
               

            transform:skew(50deg)
            
        }   
        
       

  /*--------3D TRANSFORMS AND PERSPECTIVE---------------------------------------*/      
 /* Example: perspective on parent creates 3d space*/
        .scene{
    perspective:1000px;
    perspective-origin:50% 50%;
}

/*3D transform on child*/
        .card{
            width:200px;
            height:250px;
            position:relative;

            transform-style:preserve-3d;  /*Children also 3D*/
            transition:transform 0.8s;
            cursor:pointer;  /*cursor when hovered around card is seen as pointer*/
        }

        /* Flip on hover */
        .scene:hover .card{
            transform:rotateY(180deg);
            
        }

        /* Front and Back */
        .front,
        .back{

            position:absolute;
            width:100%;
            height:100%;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:25px;
            color:white;
            border-radius:10px;

            backface-visibility:hidden;
            /*if not set hidden shows backface in front as well*/
        }

        .front{
            background:crimson;
        }

        .back{
            background:royalblue;
            transform:rotateY(180deg);
        }

</style>
        


    
</head>
<body>
    <h1>Transforms</h1>
    <hr>
    <hr>
    <h2>Transform Functions</h2>
    <div class="transform-functions-translate">
       <div class="circle">
        Circle
       </div>
    </div>

    <div class="transform-functions-rotate">
       <div class="square">
        square
       </div>
    </div>

    <div class="transform-functions">
       <div class="Triangle"></div>
       <div class="sq1"></div>
    </div>

    <div class="transform-functions-translate">
       <div class="circle1"></div>
    </div>

    <div class="scene">

        <div class="card">

            <div class="front">
                FRONT
            </div>

            <div class="back">
                BACK
            </div>

        </div>

    </div>






</body>
</html>

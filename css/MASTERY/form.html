<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>

        .form-card{
            width: min(90%, 380px);
            margin: 2rem auto;
            background:#fff;
            border-radius:16px;
            padding: 2.5rem;
            box-shadow: 0 8px 40px rgba(0,0,0,0.12);
        }

        .form-title{
            font-size: 1.5rem;
            font-weight: 800;
            color:#1e293b;
            margin: 0 0 0.25rem;
        }

        .form-group{
            margin-bottom: 1.25rem;
            position:relative;
        }

        .form-label{
            display:block;
            font-size: 0.85rem;
            font-weight: 600;
            color:#374151;
            margin-bottom: 0.4rem;
        }

        .form-input{
            width:100%;
            padding: 0.7rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #1e293b;
            background:#fff;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
            outline:none;
        }

        .form-input:focus{ border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .form-input::placeholder{color:#94a3b8;}

    .form-hint{
        position:absolute;
        right:0;
        top:0;
        font-size: 0.78rem;
        color:#6366f1;
        text-decoration:none;
    }
    .form-hint:hover{text-decoration:underline;}

    .form-submit{
        width:100%;
        background: #6366f1;
        color:#fff;
        border:none;
        padding: 0.85rem;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor:pointer;
        margin-top:0.5rem;
        transition: all 0.2s;
    }

    .form-submit:hover{
        background:#4f46e5;
        transform:translateY(-1px);
        box-shadow:0 4px 12px rgba(99,102,241,0.35);

    }

    .form-footer{
        text-align:center;
        margin-top: 1.25rem;
        font-size: 0.85rem;
        color:#64748b;
    }

    .form-footer a{ color:#6366f1; text-decoration:none; font-weight:600;}
    .form-footer a:hover{text-decoration-line:underline;}

    </style>
</head>
<body>
    <div class="form-card">
        <h2 class="form-title">Welcome back</h2>
        <p class="form-subtitle">Sign in to your account</p>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" placeholder="you@example.com">

        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" placeholder="........">
          <a href="#" class="form-hint">Forgot password?</a>
        </div>

        <button class="form-submit">Sign In</button>

        <p class="form-footer">
            No account? <a href="#">Sign Up Free</a>
        </p>
    </div>
</body>
</html>

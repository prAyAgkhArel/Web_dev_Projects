<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTERY</title>
    <style>
                *,
        *::before,
        *::after {
        box-sizing: border-box;
        }

        h1::before{
            content:"👉";
        }

        h1::after{
            content:"👈";
        }

        h1{
            text-transform:uppercase;
            text-align:center;
            background:linear-gradient(to right, royalblue 80%, red);
            color:white;
            position:sticky;
            z-index:1000;
            top:0px;
            border-radius:5px;
        }

        html{
            scroll-behavior:smooth;
        }

        
      body {
        background: linear-gradient(to right, #d374eb5c, #8b79ca0e);
        padding: 20px;
        min-height: 100vh;
      }

    </style>
</head>
<body>
    <header>
        <h1>Mastery</h1>
    </header>
</body>
</html>
